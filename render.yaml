services:
  - type: web
    name: trailmates-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: HF_MODEL
        value: meta-llama/Llama-3.2-3B-Instruct
      - key: HF_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
